<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mister Shawarma — Live Sales & WhatsApp Reporter</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg: #0f0f10;
      --card: #18181b;
      --card-2: #222226;
      --border: #2e2e34;
      --yellow: #ffd600;
      --yellow-dark: #e0bc00;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --green: #22c55e;
      --red: #ef4444;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 40px;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 14px;
    }

    /* Login Screen */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(160deg, #1b1b20, #121215);
      border: 1px solid rgba(255, 214, 0, 0.45);
      border-radius: 22px;
      padding: 24px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .login-logo {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: var(--yellow);
      color: #111;
      font-weight: 900;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      box-shadow: 0 6px 20px rgba(255, 214, 0, 0.3);
    }

    .login-title {
      text-align: center;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.4px;
    }

    .login-title span {
      color: var(--yellow);
    }

    .login-sub {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      margin-bottom: 20px;
    }

    /* Header */
    .header {
      background: linear-gradient(145deg, #1b1b1f, #121214);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: var(--yellow);
      color: #111;
      font-weight: 900;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(255, 214, 0, 0.25);
    }

    .brand-text h1 {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.15;
    }

    .brand-text h1 span {
      color: var(--yellow);
      display: block;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      color: var(--green);
      margin-top: 3px;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    .header-btns {
      display: flex;
      gap: 6px;
    }

    .btn-ghost {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-ghost:active {
      transform: scale(0.97);
    }

    /* 3 Tabs: New Report, History, Deleted */
    .tabs {
      display: grid;
      grid-template-columns: 1.15fr 1.15fr 0.85fr;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 6px;
      margin-bottom: 14px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 10px 6px;
      border-radius: 13px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: 0.15s ease;
    }

    .tab-btn.active {
      background: var(--yellow);
      color: #111;
    }

    .tab-btn.del-tab.active {
      background: #ef4444;
      color: #fff;
    }

    .badge-count {
      background: rgba(0, 0, 0, 0.22);
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
    }

    .tab-btn:not(.active) .badge-count {
      background: var(--card-2);
      color: var(--yellow);
    }

    .tab-btn.del-tab:not(.active) .badge-count {
      color: #f87171;
    }

    /* Cards & Inputs */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--yellow);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      margin-bottom: 10px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="number"],
    input[type="tel"],
    input[type="password"] {
      width: 100%;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 15px;
      font-weight: 700;
      outline: none;
    }

    input:focus {
      border-color: var(--yellow);
    }

    .pass-wrap {
      position: relative;
    }

    .toggle-eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Preset Chips */
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .chip {
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .chip:active {
      background: var(--yellow);
      color: #111;
    }

    /* Expense Rows */
    .exp-add-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr auto;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn-add {
      background: var(--yellow);
      color: #111;
      border: none;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .exp-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .exp-item {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .exp-item-left {
      font-weight: 600;
    }

    .exp-item-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .exp-amt {
      color: #f87171;
      font-weight: 700;
    }

    .btn-del-item {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: none;
      border-radius: 8px;
      width: 26px;
      height: 26px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Live KPI Summary */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .kpi-box {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
    }

    .kpi-box span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .kpi-box strong {
      font-size: 15px;
      font-weight: 800;
    }

    .text-green { color: var(--green); }
    .text-red { color: #f87171; }
    .text-yellow { color: var(--yellow); }

    .meta-strip {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      background: #131316;
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    /* WhatsApp Preview */
    .wa-box {
      background: #0b141a;
      border: 1px solid #1f2c33;
      border-radius: 12px;
      padding: 12px;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      line-height: 1.45;
      color: #e9edef;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: var(--yellow);
      color: #111;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-wa {
      background: #25d366;
      color: #0b141a;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-save {
      width: 100%;
      background: #27272a;
      color: var(--yellow);
      border: 1px solid var(--yellow);
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn-save:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* History & Deleted Cards */
    .partner-card {
      background: linear-gradient(145deg, #222014, #18181b);
      border: 1px solid rgba(255, 214, 0, 0.35);
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
    }

    .partner-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .partner-share {
      font-size: 20px;
      font-weight: 900;
      color: var(--yellow);
    }

    .record-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .record-card.deleted-item {
      border-color: rgba(239, 68, 68, 0.35);
      background: linear-gradient(160deg, #1b1517, #151518);
    }

    .record-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .record-date {
      font-size: 16px;
      font-weight: 800;
    }

    .record-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .margin-pill {
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .deleted-pill {
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 999px;
    }

    .record-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-sm {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-sm.yellow {
      background: var(--yellow);
      color: #111;
      border-color: var(--yellow);
    }

    .btn-sm.green {
      background: rgba(34, 197, 94, 0.18);
      color: var(--green);
      border-color: rgba(34, 197, 94, 0.35);
    }

    .btn-sm.danger {
      background: rgba(239, 68, 68, 0.14);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .btn-danger-outline {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
      border-radius: 9px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-box {
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 26px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* Security Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 390px;
      background: var(--card);
      border: 1px solid var(--yellow);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--yellow);
      margin-bottom: 4px;
    }

    .modal-desc {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .error-msg {
      color: #f87171;
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
      min-height: 16px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--yellow);
      color: #111;
      font-size: 12px;
      font-weight: 800;
      padding: 10px 16px;
      border-radius: 999px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- SCREEN 1: LOGIN SCREEN -->
  <div id="loginScreen" class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">MS</div>
      <div class="login-title">MISTER <span>SHAWARMA</span></div>
      <div class="login-sub">Live Cloud Sales & Expense Portal</div>

      <form onsubmit="handleAppLogin(event)">
        <div class="field">
          <label>Mobile Number (Login ID)</label>
          <input type="tel" id="loginPhone" placeholder="Enter 10-digit mobile number" maxlength="10" required />
        </div>

        <div class="field">
          <label>Password</label>
          <div class="pass-wrap">
            <input type="password" id="loginPass" placeholder="Enter password" required />
            <button type="button" class="toggle-eye" onclick="toggleInputEye('loginPass', this)">Show</button>
          </div>
        </div>

        <div id="loginError" class="error-msg"></div>

        <button type="submit" class="btn-primary" style="width:100%;margin-top:12px;font-size:15px;">
          Login & Open Live Report
        </button>
      </form>
    </div>
  </div>

  <!-- SCREEN 2: MAIN APP -->
  <div id="appScreen" class="container hidden">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="logo-badge">MS</div>
        <div class="brand-text">
          <h1>MISTER <span>SHAWARMA</span></h1>
          <div id="syncBadge" class="sync-status">
            <span id="syncDot" class="sync-dot"></span>
            <span id="syncText">Connecting Live...</span>
          </div>
        </div>
      </div>
      <div class="header-btns">
        <button class="btn-ghost" onclick="clearForm()">Clear</button>
        <button class="btn-ghost" style="color:#f87171;" onclick="logoutApp()">Logout</button>
      </div>
    </div>

    <!-- 3 Navigation Tabs -->
    <div class="tabs">
      <button id="tabNewBtn" class="tab-btn active" onclick="switchTab('new')">+ New Sale</button>
      <button id="tabHistBtn" class="tab-btn" onclick="switchTab('hist')">
        Saved <span id="recordCountBadge" class="badge-count">0</span>
      </button>
      <button id="tabDelBtn" class="tab-btn del-tab" onclick="switchTab('del')">
        Delete <span id="deletedCountBadge" class="badge-count">0</span>
      </button>
    </div>

    <!-- TAB 1: NEW DAILY REPORT -->
    <div id="viewNew">
      <div class="card">
        <div class="section-title">
          <span>1. Sales & Chicken Stock</span>
          <span id="editingBadge" class="text-yellow hidden">Editing Saved Day</span>
        </div>

        <div class="field">
          <label>Report Date (DD / MM / YYYY)</label>
          <input type="text" id="inpDate" placeholder="23 / 11 / 2026" oninput="updateLive()" />
        </div>

        <div class="grid-2">
          <div class="field">
            <label>Cash (₹)</label>
            <input type="number" id="inpCash" placeholder="0" oninput="updateLive()" />
          </div>
          <div class="field">
            <label>UPI (₹)</label>
            <input type="number" id="inpUpi" placeholder="0" oninput="updateLive()" />
          </div>
          <div class="field">
            <label>Zomato (₹)</label>
            <input type="number" id="inpZomato" placeholder="0" oninput="updateLive()" />
          </div>
          <div class="field">
            <label>Swiggy (₹)</label>
            <input type="number" id="inpSwiggy" placeholder="0" oninput="updateLive()" />
          </div>
          <div class="field">
            <label>Chicken Sold (kg)</label>
            <input type="number" step="0.1" id="inpChickenSold" placeholder="15" oninput="updateLive()" />
          </div>
          <div class="field">
            <label>Chicken Left (kg)</label>
            <input type="number" step="0.1" id="inpChickenLeft" placeholder="0" oninput="updateLive()" />
          </div>
        </div>
      </div>

      <!-- Expenses -->
      <div class="card">
        <div class="section-title">
          <span>2. Daily Expenses</span>
          <span id="expCountLabel" class="text-muted">0 items</span>
        </div>

        <div class="presets">
          <button class="chip" onclick="quickSelect('Chicken')">+ Chicken</button>
          <button class="chip" onclick="quickSelect('Roti')">+ Roti</button>
          <button class="chip" onclick="quickSelect('Rom + B + M')">+ Rom + B + M</button>
          <button class="chip" onclick="quickSelect('Oil + bh')">+ Oil + bh</button>
          <button class="chip" onclick="quickSelect('Gas')">+ Gas</button>
          <button class="chip" onclick="quickSelect('Building wala')">+ Building wala</button>
          <button class="chip" onclick="quickSelect('Porter')">+ Porter</button>
          <button class="chip" onclick="quickSelect('Khana')">+ Khana</button>
          <button class="chip" onclick="quickSelect('Tissue paper')">+ Tissue paper</button>
        </div>

        <div class="exp-add-row">
          <input type
